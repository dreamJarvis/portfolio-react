<!DOCTYPE html>
<html>

<head>
   <meta charset="utf-8">
   <title>Portfolio</title>
   <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current URL and converts it into
      // the URL you would get if you were routing with traditional routing.
      //
      // So effectively what we're doing is hijacking the 404 response
      // and serving the index.html file and letting
      // list.js handle the routing there.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
         l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
         l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
         l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/')
            .replace(/&/g, '~and~') +
         (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
         l.hash
      );

   </script>
</head>

<body>
</body>

</html>
